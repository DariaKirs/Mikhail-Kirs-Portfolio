name: Optimize preview images

on:
  push:
    branches:
      - preview/selected-work-covers
    paths:
      - '.github/workflows/optimize-images-preview.yml'
      - 'assets/images/Portrait.JPG'
      - 'assets/images/London_Bridge.jpeg'
      - 'assets/images/selected-work/Personal_Brand_Cover_1.png'
      - 'assets/images/selected-work/Personal_Brend_Cover_4.png'
      - 'assets/images/selected-work/Local_Cover.png'

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[skip image-opt]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/selected-work-covers
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate responsive WebP images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import json

          targets = {
              'portrait': Path('assets/images/Portrait.JPG'),
              'london-bridge': Path('assets/images/London_Bridge.jpeg'),
              'personal-brand-card': Path('assets/images/selected-work/Personal_Brand_Cover_1.png'),
              'personal-brand-detail': Path('assets/images/selected-work/Personal_Brend_Cover_4.png'),
              'local-business': Path('assets/images/selected-work/Local_Cover.png'),
          }
          widths = (480, 800, 1200)
          out_dir = Path('assets/images/optimized')
          out_dir.mkdir(parents=True, exist_ok=True)
          manifest = {}

          for slug, source in targets.items():
              with Image.open(source) as im:
                  im = ImageOps.exif_transpose(im)
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGB')
                  original_w, original_h = im.size
                  rows = []
                  for target_w in widths:
                      actual_w = min(target_w, original_w)
                      actual_h = round(original_h * actual_w / original_w)
                      resized = im if actual_w == original_w else im.resize((actual_w, actual_h), Image.Resampling.LANCZOS)
                      out = out_dir / f'{slug}-{actual_w}.webp'
                      resized.save(out, 'WEBP', quality=80, method=6)
                      rows.append({
                          'file': str(out),
                          'width': actual_w,
                          'height': actual_h,
                          'bytes': out.stat().st_size,
                      })
                  manifest[slug] = {
                      'source': str(source),
                      'source_width': original_w,
                      'source_height': original_h,
                      'source_bytes': source.stat().st_size,
                      'variants': rows,
                  }

          Path('assets/images/optimized/manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Commit optimized assets
        run: |
          if git diff --quiet -- assets/images/optimized; then
            echo 'No optimized image changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/optimized
          git commit -m 'Add responsive WebP image variants [skip image-opt]'
          git push origin HEAD:preview/selected-work-covers
