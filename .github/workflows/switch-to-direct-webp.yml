name: Switch site to direct WebP assets

on:
  push:
    branches:
      - preview/selected-work-covers
    paths:
      - .github/workflows/switch-to-direct-webp.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/selected-work-covers
          fetch-depth: 0

      - name: Switch active pages to direct WebP files
        run: |
          python <<'PY'
          from pathlib import Path
          import json, re

          # Files that make up the active portfolio path.
          html_files = {
              Path('index.html'): {
                  'Portrait.JPG': 'hero-mikhail.webp',
                  'Portrait_Fanshawe.JPG': 'about-fanshawe.webp',
                  'IMG_5720.jpeg': 'about-fanshawe.webp',
                  'Bordo_Mustafa.jpeg': 'selected-work-personal-brand.webp',
                  'Misha_Golf_front.jpeg': 'local-business.webp',
                  'London_Bridge.jpeg': 'long-form-cover-london-bridge.webp',
              },
              Path('personal-brand.html'): {
                  'selected-work/Personal_Brend_Cover_4.png': 'personal-brand-main.webp',
                  'Personal_Brend_Cover_4.png': 'personal-brand-main.webp',
              },
              Path('project-forest-city.html'): {
                  'selected-work/Local_Cover.png': 'local-business.webp',
                  'Local_Cover.png': 'local-business.webp',
              },
              Path('project-city-storytelling.html'): {
                  'London_Bridge.jpeg': 'long-form-main-london-eye.webp',
              },
          }

          def replace_optimizer(text, old_fragment, new_file):
              # Vercel optimizer URLs use URL-encoded source paths.
              encoded = old_fragment.replace('/', '%2F')
              if not encoded.startswith('%2F'):
                  encoded = '%2Fassets%2Fimages%2F' + encoded
              pattern = r'/_vercel/image\?url=' + re.escape(encoded) + r'&(?:amp;)?w=\d+&(?:amp;)?q=\d+'
              return re.sub(pattern, 'assets/images/' + new_file, text)

          for path, mapping in html_files.items():
              text = path.read_text()
              for old, new in mapping.items():
                  # Direct static references.
                  text = text.replace('assets/images/' + old, 'assets/images/' + new)
                  # Encoded optimizer references.
                  text = replace_optimizer(text, old, new)

              # The optimizer-era srcset/sizes attributes are no longer needed.
              # Remove only attributes that still contain /_vercel/image so unrelated responsive markup is untouched.
              text = re.sub(r'\s+srcset="[^"]*/_vercel/image[^"]*"', '', text)
              text = re.sub(r'\s+sizes="[^"]*"(?=\s+(?:alt|width|height|fetchpriority|loading|decoding|class|/?>))', '', text)
              path.write_text(text)

          # Homepage first Selected Work cover is now the Personal Brand cover.
          # Keep the existing content/case link untouched for this image-only migration.

          # Remove old CSS image substitution layers so HTML is the single source of truth.
          p8 = Path('assets/css/part-8.css')
          if p8.exists():
              text = p8.read_text()
              text = re.sub(r'\n?\s*content:\s*url\("\.\./images/IMG_5720\.jpeg"\)\s*!important;\s*', '\n', text)
              p8.write_text(text)

          p11 = Path('assets/css/part-11.css')
          if p11.exists():
              text = p11.read_text()
              marker = '/* Image optimization pass — preview only.'
              if marker in text:
                  text = text.split(marker, 1)[0].rstrip() + '\n'
              p11.write_text(text)

          styles = Path('styles.css')
          if styles.exists():
              text = styles.read_text()
              # Remove only legacy raster image substitutions; layout CSS remains intact.
              text = re.sub(
                  r'\n?\s*content:\s*url\("assets/images/[^\"]+\.(?:png|jpe?g|JPG)"\)\s*!important;\s*',
                  '\n', text, flags=re.I
              )
              styles.write_text(text)

          # Direct WebP delivery means Vercel's runtime image transformation is no longer part of this site path.
          v = Path('vercel.json')
          if v.exists():
              data = json.loads(v.read_text())
              data.pop('images', None)
              v.write_text(json.dumps(data, indent=2) + '\n')

          # Sanity checks: the four active pages must point to the seven prepared WebPs.
          required = {
              'index.html': ['hero-mikhail.webp', 'about-fanshawe.webp', 'selected-work-personal-brand.webp', 'local-business.webp', 'long-form-cover-london-bridge.webp'],
              'personal-brand.html': ['personal-brand-main.webp'],
              'project-forest-city.html': ['local-business.webp'],
              'project-city-storytelling.html': ['long-form-main-london-eye.webp'],
          }
          for filename, needles in required.items():
              text = Path(filename).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{filename} is missing {needle}')
              if '/_vercel/image' in text:
                  raise SystemExit(f'{filename} still contains Vercel image optimizer references')

          # Verify the seven files really exist before committing code that points at them.
          for name in [
              'hero-mikhail.webp', 'about-fanshawe.webp', 'selected-work-personal-brand.webp',
              'personal-brand-main.webp', 'local-business.webp',
              'long-form-cover-london-bridge.webp', 'long-form-main-london-eye.webp'
          ]:
              if not Path('assets/images', name).exists():
                  raise SystemExit(f'Missing uploaded WebP: {name}')

          print('Direct WebP migration verified.')
          PY

      - name: Commit migration and remove one-time workflow
        run: |
          rm -f .github/workflows/switch-to-direct-webp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch active portfolio images to direct WebP assets"
          git push origin HEAD:preview/selected-work-covers
