name: Preview A1 A2 navigation and watch CTAs

on:
  push:
    branches:
      - preview/selected-work-covers
    paths:
      - .github/workflows/preview-a1-a2.yml

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/selected-work-covers

      - name: Build A1 and A2 preview
        run: |
          python .github/scripts/preview_a1_a2.py
          python .github/scripts/preview_a1_a2_finalize.py

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-brand.html project-forest-city.html project-city-storytelling.html assets/css/part-11.css styles.css assets/js/reveal.js assets/js/site-footer.js index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize A1 navigation and A2 watch CTAs preview"
          git push origin HEAD:preview/selected-work-covers
