name: Preview site text dash audit

on:
  push:
    branches:
      - preview/selected-work-covers
    paths:
      - .github/workflows/preview-a1-a2.yml

permissions:
  contents: write

jobs:
  audit-site-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/selected-work-covers

      - name: Replace em dashes with hyphens in site text sources
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              *Path('.').glob('*.html'),
              *Path('assets/js').glob('*.js'),
              *Path('api').glob('*.js'),
          ]

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              revised = text.replace('—', '-')
              if revised != text:
                  path.write_text(revised, encoding='utf-8')
                  changed.append(str(path))

          remaining = [
              str(path)
              for path in files
              if '—' in path.read_text(encoding='utf-8')
          ]
          if remaining:
              raise SystemExit(f'Em dash remains in: {remaining}')

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit text-only dash replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html assets/js/*.js api/*.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Replace em dashes with hyphens across site text"
          git push origin HEAD:preview/selected-work-covers
