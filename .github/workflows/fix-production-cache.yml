name: Fix production asset cache

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-production-cache.yml

permissions:
  contents: write

jobs:
  fix-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bust stale CSS and image cache
        run: |
          python - <<'PY'
          from pathlib import Path

          stamp = '20260824-2101'

          # Force browsers to fetch the current stylesheet on every active page.
          for path in Path('.').glob('*.html'):
              text = path.read_text()
              text = text.replace('styles.css?v=20260809-2106', f'styles.css?v={stamp}')
              text = text.replace('styles.css?v=20260824-2101', f'styles.css?v={stamp}')
              if path.name == 'index.html':
                  text = text.replace('assets/images/selected-work-personal-brand.webp"', f'assets/images/selected-work-personal-brand.webp?v={stamp}"')
                  text = text.replace('assets/images/local-business.webp"', f'assets/images/local-business.webp?v={stamp}"')
              path.write_text(text)

          # Force fresh imports for the CSS files that changed during the image migration.
          styles = Path('styles.css')
          text = styles.read_text()
          text = text.replace('@import url("assets/css/part-8.css");', f'@import url("assets/css/part-8.css?v={stamp}");')
          text = text.replace('@import url("assets/css/part-11.css?v=20260809-2139");', f'@import url("assets/css/part-11.css?v={stamp}");')
          text = text.replace('@import url("assets/css/part-11.css?v=20260824-2101");', f'@import url("assets/css/part-11.css?v={stamp}");')
          styles.write_text(text)

          # Safety lock: the <img> src must win over any older CSS content:url() rule.
          css = Path('assets/css/part-11.css')
          text = css.read_text()
          marker = '/* Homepage Selected Work image source lock — 2026-08-24. */'
          if marker not in text:
              text += '''\n\n/* Homepage Selected Work image source lock — 2026-08-24.\n   Prevent stale/legacy CSS content:url() rules from replacing the new WebP src. */\nhtml body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page)\n  #work .work-grid > .card:nth-child(1) .card-media > img,\nhtml body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page)\n  #work .work-grid > .card:nth-child(2) .card-media > img,\nhtml body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page)\n  #work .work-grid > .card:nth-child(3) .card-media > img {\n  content: normal !important;\n}\n'''
              css.write_text(text)
          PY

      - name: Commit production cache fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html personal-brand.html project-forest-city.html project-city-storytelling.html project-mayoral.html styles.css assets/css/part-11.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bust stale production asset cache"
          git push origin HEAD:main
