name: Fix homepage anchor offsets

on:
  push:
    branches:
      - preview/selected-work-covers
    paths:
      - .github/workflows/fix-home-anchor-offsets.yml

permissions:
  contents: write

jobs:
  fix-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/selected-work-covers

      - name: Align homepage navigation anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/css/part-11.css')
          css = path.read_text()
          marker = '/* Homepage navigation anchors — final shared desktop offset. */'
          if marker not in css:
              css += '''\n\n/* Homepage navigation anchors — final shared desktop offset. */\n@media (min-width: 821px) {\n  html body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page) #work.work-section,\n  html body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page) #about.about-section,\n  html body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page) #contact.contact-section {\n    scroll-margin-top: 18px !important;\n  }\n}\n\n@media (min-width: 821px) and (max-height: 820px) {\n  html body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page) #work.work-section,\n  html body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page) #about.about-section,\n  html body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page) #contact.contact-section {\n    scroll-margin-top: 30px !important;\n  }\n}\n'''
              path.write_text(css)
          PY

      - name: Commit anchor fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/part-11.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Align all homepage navigation anchors"
          git push origin HEAD:preview/selected-work-covers
