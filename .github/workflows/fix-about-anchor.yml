name: Fix About anchor landing

on:
  push:
    branches:
      - preview/selected-work-covers
    paths:
      - .github/workflows/fix-about-anchor.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/selected-work-covers
      - name: Add About anchor correction
        run: |
          cat >> assets/css/part-11.css <<'CSS'

          /* Homepage desktop About anchor: cancel the global 104px section offset
             so the About sheet lands high enough beneath the sticky header. */
          @media (min-width: 821px) {
            html body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page) #about.about-section {
              scroll-margin-top: 18px !important;
            }
          }

          @media (min-width: 821px) and (max-height: 820px) {
            html body:not(.personal-brand-page):not(.local-business-page):not(.long-form-page) #about.about-section {
              scroll-margin-top: 30px !important;
            }
          }
          CSS
          rm .github/workflows/fix-about-anchor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/part-11.css .github/workflows/fix-about-anchor.yml
          git commit -m "Fix About anchor landing position"
          git push origin HEAD:preview/selected-work-covers
